apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: dr-demo-hpa
  namespace: dr-demo
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: dr-demo-app
  minReplicas: 3
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70